<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About Us | DIGI JEWELRY STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="style.css">
<style>

.hero {
    padding:120px 0 100px;
background:
linear-gradient(rgba(2,8,23,0.85),rgba(2,8,23,0.92)),
url('images/rolex (3).jpg');
background-size:cover;
background-position:center;
text-align:center;
}

.hero p{
letter-spacing:2px;
margin-bottom:20px;
font-weight:600;
}

.hero h1{
font-size:clamp(52px,8vw,90px);
line-height:1;
margin-bottom:25px;
}

.hero-text{
max-width:850px;
margin:auto;
color:#cbd5e1;
line-height:1.9;
font-size:18px;
}

.about-section{
padding:110px 0;
}

.about-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:70px;
align-items:center;
}

.about-image{
position:relative;
}

.about-image img{
border-radius:30px;
height:700px;
width:100%;
object-fit:cover;
}

.experience-box{
position:absolute;
bottom:30px;
left:30px;
background:#f59e0b;
padding:25px 30px;
border-radius:24px;
}

.experience-box h2{
font-size:48px;
margin-bottom:5px;
}

.about-content p.small-title{
color:#f59e0b;
margin-bottom:15px;
font-weight:600;
letter-spacing:2px;
}

.about-content h2{
font-size:54px;
line-height:1.1;
margin-bottom:30px;
}

.about-content .desc{
color:#cbd5e1;
line-height:2;
margin-bottom:30px;
}

.features{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-bottom:40px;
}

.feature-box{
background:#071526;
padding:25px;
border-radius:24px;
border:1px solid rgba(255,255,255,0.08);
}

.feature-box i{
font-size:32px;
color:#f59e0b;
margin-bottom:18px;
}

.feature-box h4{
margin-bottom:10px;
font-size:20px;
}

.feature-box p{
color:#94a3b8;
line-height:1.7;
font-size:14px;
}

.cta-btn{
display:inline-flex;
align-items:center;
gap:12px;
padding:18px 32px;
background:#f59e0b;
color:white;
text-decoration:none;
border-radius:16px;
font-weight:700;
transition:0.3s;
}

.cta-btn:hover{
transform:translateY(-4px);
}

.stats-section{
padding-bottom:110px;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
}

.stat-card{
background:#071526;
padding:45px 30px;
border-radius:28px;
text-align:center;
border:1px solid rgba(255,255,255,0.08);
}

.stat-card h2{
font-size:56px;
color:#f59e0b;
margin-bottom:10px;
}

.stat-card p{
color:#cbd5e1;
}

@media(max-width:991px){

.about-grid,
.stats-grid{
grid-template-columns:1fr;
}

.about-image img{
height:500px;
}

}

@media(max-width:768px){

.navbar{
flex-direction:column;
gap:20px;
}

.nav-links{
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.hero h1,
.about-content h2{
font-size:42px;
}

.features{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

    <header>
<div class="container navbar">

<div class="logo">
<img src="images/digilogo.jpg" alt="DIGI Logo">
<h2>DIGI JEWELRY <span>STORE</span></h2>
</div>

<div class="nav-links">
<a href="digi.html">HOME</a>
<a href="shop.html">SHOP</a>
<a href="about.html" class="active">ABOUT</a>
<a href="contact.html">CONTACT</a>
</div>

</div>
</header>

<section class="hero">
<p>Luxury shopping experience designed to satisfy high-end customers.</p>
</div>

</div>

<a href="shop.html" class="cta-btn">
<i class="fa-solid fa-bag-shopping"></i>
SHOP COLLECTION
</a>

</div>

</div>
</section>

<section class="stats-section">
<div class="container">

<div class="stats-grid">

<div class="stat-card">
<h2>500+</h2>
<p>Luxury Products Sold</p>
</div>

<div class="stat-card">
<h2>98%</h2>
<p>Customer Satisfaction</p>
</div>

<div class="stat-card">
<h2>50+</h2>
<p>Luxury Brands</p>
</div>

<div class="stat-card">
<h2>24/7</h2>
<p>Customer Support</p>
</div>

</div>

</div>
</section>

<footer>
<div class="container footer-content">

<div class="footer-logo">
<h3>DIGI JEWELRY <span>STORE</span></h3>
</div>

<div class="footer-text">
© 2026 DIGI JEWELRY STORE. All Rights Reserved.
</div>

</div>
</footer>

</body>
</html>
